name: README progress from TODO

on:
  push:
    branches: [main]
    paths:
      - "TODO.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update progress indicator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          todo = Path("TODO.md").read_text(encoding="utf-8")
          choices = re.findall(r"^[ \t]*[-*][ \t]+\[([ xX])\][ \t]", todo, re.MULTILINE)
          total = len(choices)
          done = sum(item.lower() == "x" for item in choices)
          percentage = round(100 * done / total) if total else 0
          segments = 30
          filled = round(segments * done / total) if total else 0
          bar = "█" * filled + "░" * (segments - filled)

          block = (
              "<!-- progress:start -->\n"
              f"**{percentage} % · {done} von {total} Aufgaben erledigt**\n\n"
              f"`{bar}`\n"
              "<!-- progress:end -->"
          )
          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          pattern = r"<!-- progress:start -->.*?<!-- progress:end -->"
          updated, count = re.subn(pattern, lambda _: block, original, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("README progress markers not found")
          if updated != original:
              readme.write_text(updated, encoding="utf-8")
          print(f"TODO progress: {done}/{total} ({percentage}%)")
          PY

      - name: Commit README when progress changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Progress is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README progress from TODO"
          git push
