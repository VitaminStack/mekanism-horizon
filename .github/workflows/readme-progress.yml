name: README progress from TODO

on:
  push:
    branches: [main]
    paths:
      - "TODO.md"
      - "scripts/sync_readme_progress.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate progress bars from TODO
        run: python3 scripts/sync_readme_progress.py

      - name: Commit README if progress changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Progress is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README progress from TODO"
          git push
